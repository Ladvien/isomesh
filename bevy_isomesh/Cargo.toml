[package]
name = "bevy_isomesh"
description = "Bevy integration for isomesh: signed distance field in, Bevy Mesh out."
version = "0.0.9"
edition = "2024"
# Bevy 0.19's own crates declare 1.95.0, and this crate cannot compile without
# them, so claiming less would be a floor nothing can stand on.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ladvien/isomesh"
authors = ["C. Thomas Brittain <cthomasbrittain@yahoo.com>"]
documentation = "https://docs.rs/bevy_isomesh"
readme = "README.md"
# `bevy` first: it is the term a Bevy user searches, and crates.io weights
# keyword position. Both lists at or under the 5-item cap.
keywords = ["bevy", "voxel", "isosurface", "marching-cubes", "sdf"]
categories = ["game-development", "graphics", "rendering"]

# Deliberately its own workspace, not a member of the root one. In a shared
# workspace Cargo's feature unification hands `glam` the `std`, `serde`,
# `bytemuck` and `encase` features that Bevy asks for, so `cargo test` in the
# root would stop testing what a consumer of `isomesh` actually gets.
[workspace]

# docs.rs builds with every feature, so the `experimental` module appears there
# even though it is off by default. A reader evaluating the crate should be able
# to see what is behind a feature without checking out the source to find out it
# exists -- D-0/B-010, per Effective Rust Item 27: crates.io is for people
# CHOOSING a crate, docs.rs for people USING one.
[package.metadata.docs.rs]
all-features = true

[dependencies]
# Path *and* version: a path-only dependency cannot publish, and the version is
# what a crates.io consumer resolves.
isomesh = { path = "../crates/isomesh", version = "0.0.9" }

# Leaf crates, never the `bevy` umbrella. Bevy 0.17-0.19 carved `bevy_camera`,
# `bevy_light`, `bevy_shader`, `bevy_mesh` and `bevy_material` out of
# `bevy_render` precisely so an integration like this one can exist without
# dragging in the renderer. A consumer doing CPU-only meshing into a `Mesh`
# asset never compiles it.
bevy_asset = "0.19"
bevy_mesh = "0.19"

# B-003's plugin. All four are already in the tree transitively through
# `bevy_asset`, so naming them directly costs nothing new -- and a Bevy
# integration crate that cannot be a Bevy plugin would be an odd thing.
#
# `bevy_render` is still absent, deliberately. The plugin produces a
# `Handle<Mesh>` and stops; attaching `Mesh3d` is the application's line to
# write, which is what keeps a CPU-only consumer from compiling the renderer.
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_tasks = "0.19"

# The clock. `std::time::Instant::now()` compiles on wasm32-unknown-unknown and
# then panics, which made `IsomeshPlugin` -- this crate's whole surface -- unusable
# in a browser, and the frame-budget system is where it fired (`apply_finished_meshes`).
# `bevy_platform::time::Instant` is `std`'s on native and `web_time`'s on the web,
# and it is Bevy's own re-export rather than a second clock crate of our choosing.
bevy_platform = "0.19"

# The one loud channel for a failed extraction. Already in the tree
# transitively -- `bevy_asset` logs through it -- and Bevy's `LogPlugin` is
# the subscriber that surfaces it.
tracing = { version = "0.1", default-features = false }

# `bevy_platform`'s web cfg is `all(target_arch = "wasm32", feature = "web")`, and
# the feature is additive, so this is the same dependency with one more feature on
# one target rather than a second path. This is a real dependency rather than one
# of the dev-dependency tables further down: the panic it removes is in the
# library, so a consumer's own wasm build needs the feature too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_platform = { version = "0.19", features = ["web"] }

# Examples only. Dev-dependencies are not propagated to consumers, so nothing
# here reaches anyone depending on this crate.
#
# Note the absence of "x11": that is a Linux windowing backend and this project
# targets macOS/Metal, where `bevy_winit` needs no extra feature flag.
[dev-dependencies]
bevy = "0.19"

# `game_dig` offers Marching Cubes on the GPU as its eighth mesher key, and
# `game_dig` is the first entry in `scripts/build_web.sh`'s `DEMOS` array -- so
# both of these are reachable from a web build now and neither can sit behind the
# `cfg(not(target_arch = "wasm32"))` table below any more. Dev-dependencies are
# not propagated, so nobody depending on `bevy_isomesh` inherits either.
#
# `isomesh-gpu` asks wgpu for `["wgsl", "dx12", "metal", "vulkan", "webgpu"]`:
# one unconditional list, and wgpu's own `build.rs` gates every backend by
# target, so exactly one of them is live per target. Omitting `webgpu` is the
# trap -- wasm32 then links *zero* backends and there is no compile error,
# because `build.rs` simply leaves `wgpu-core` out.
#
# The wgpu pin is what makes this safe. `isomesh-gpu` asks for 29.0.3 and Bevy
# 0.19 asks for 29.0.3, so Cargo unifies them onto one copy -- the failure mode
# is two silently coexisting majors and a type error about `TextureFormat` not
# matching itself. Version alongside the path: cargo strips path-only
# dev-dependencies from the published manifest, which would leave the packaged
# GPU examples uncompilable from the tarball. With the version they resolve
# against crates.io.
isomesh-gpu = { path = "../crates/isomesh-gpu", version = "0.0.9" }

# E-303's example talks to wgpu directly -- a render pass, buffer descriptors --
# because that is what `isomesh-gpu`'s API takes.
wgpu = { version = "29.0.3", default-features = false }

# B-012's tests and doctest only. `Cuboid` is the fixture the ticket's
# acceptance names -- 24 vertices, not 8 -- and it lives in `bevy_math`. Named
# as a leaf rather than reached through the `bevy` umbrella above, for the same
# reason the real dependencies are: this crate's whole argument is that you do
# not need the umbrella. Already in the tree through `bevy_mesh`, so it adds
# nothing to the resolved graph.
bevy_math = "0.19"

# Two features, both additive, and Cargo unifies this with the unconditional
# `bevy` above -- so both are on for wasm and off for native.
#
# `web`: `bevy_platform`'s web cfg is `all(target_arch = "wasm32", feature =
# "web")`. Without it `bevy::platform::time::Instant` resolves to
# `std::time::Instant`, whose `now()` panics on wasm, which makes this the line
# that lets the web-built examples keep time at all.
#
# `webgpu`: `game_dig`'s eighth mesher runs a compute shader, and compute is not
# in WebGL2 at all. `bevy_render-0.19.0/src/settings.rs` picks
# `Backends::BROWSER_WEBGPU` whenever `webgpu` is on for `wasm32` and only falls
# to `Backends::GL` when it is off, and the same `not(feature = "webgpu")` guard
# gates the downlevel limits, the WebGL2 uniform padding, the 4 KiB uniform clamp
# and the `NO_ARRAY_TEXTURES_SUPPORT` shader defs. So this is one backend, not
# two paths.
#
# `webgl2` cannot be switched off to make that tidier: `bevy`'s `default` is
# `["2d", "3d", "ui", "audio"]`, each of `2d`/`3d`/`ui` pulls `default_platform`,
# and `default_platform` contains `webgl2`. Additive is the only move available,
# and `webgpu` taking precedence is what makes it correct rather than ambiguous.
#
# **The consequence, stated rather than discovered:** Cargo features are
# per-package and there is no per-example selection, so this moves **all nine**
# demos in `scripts/build_web.sh`'s `DEMOS` array to WebGPU, not just `game_dig`.
# `web/play.html` checks `navigator.gpu` for every one of them because of this
# line.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
bevy = { version = "0.19", features = ["web", "webgpu"] }

# Native-only, both for the same reason: neither is reachable from any example
# that gets a web build, and the examples that use them are simply not built for
# wasm. Dev-dependencies are not propagated, so consumers see no change.
#
# `isomesh-gpu` and `wgpu` used to live here too and no longer can -- see the
# plain `[dev-dependencies]` table above.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
avian3d = "0.7.0"

# E-203 only. The acid test is "walk every chunk seam and never fall through",
# and answering that needs a ray cast against the meshed triangles -- not a
# physics engine. parry3d is the same version the core crate's own collider
# tests use, so the example is checking the geometry a consumer would actually
# hand to a physics engine rather than a stand-in for it.
parry3d = "0.30"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Meshing in a debug build is 20-50x slower and will make you think something is
# wrong with the algorithm rather than with the profile. Examples are always run
# with --release, and this keeps a debug run merely slow rather than unusable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# Bevy's wasm binary is size-bound, not arithmetic-bound, so `s` beats `3` and
# `thin` beats `fat`: fat LTO on a 30 MB module costs minutes per example and CI
# builds three. `strip = "debuginfo"` rather than `true` because the name section
# is dropped by `wasm-bindgen`, the tool that knows what it may drop.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
