[package]
name = "bevy_isomesh"
description = "Bevy integration for isomesh: signed distance field in, Bevy Mesh out."
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ladvien/isomesh"
authors = ["C. Thomas Brittain <cthomasbrittain@yahoo.com>"]

# Deliberately its own workspace, not a member of the root one. In a shared
# workspace Cargo's feature unification hands `glam` the `std`, `serde`,
# `bytemuck` and `encase` features that Bevy asks for, so `cargo test` in the
# root would stop testing what a consumer of `isomesh` actually gets.
[workspace]

[dependencies]
isomesh = { path = "../crates/isomesh" }

# Leaf crates, never the `bevy` umbrella. Bevy 0.17-0.19 carved `bevy_camera`,
# `bevy_light`, `bevy_shader`, `bevy_mesh` and `bevy_material` out of
# `bevy_render` precisely so an integration like this one can exist without
# dragging in the renderer. A consumer doing CPU-only meshing into a `Mesh`
# asset never compiles it.
bevy_asset = "0.19"
bevy_mesh = "0.19"

# B-003's plugin. All four are already in the tree transitively through
# `bevy_asset`, so naming them directly costs nothing new -- and a Bevy
# integration crate that cannot be a Bevy plugin would be an odd thing.
#
# `bevy_render` is still absent, deliberately. The plugin produces a
# `Handle<Mesh>` and stops; attaching `Mesh3d` is the application's line to
# write, which is what keeps a CPU-only consumer from compiling the renderer.
bevy_app = "0.19"
bevy_ecs = "0.19"
bevy_tasks = "0.19"

[features]
default = []
# Pulls in the renderer. Nothing needs it yet; the GPU path arrives with
# GPU-001 and the plugin with B-003.
gpu = ["dep:bevy_render"]

[dependencies.bevy_render]
version = "0.19"
optional = true

# Examples only. Dev-dependencies are not propagated to consumers, so nothing
# here reaches anyone depending on this crate.
#
# Note the absence of "x11": that is a Linux windowing backend and this project
# targets macOS/Metal, where `bevy_winit` needs no extra feature flag.
[dev-dependencies]
avian3d = "0.7.0"
bevy = "0.19"

# GPU-005's example only, and a dev-dependency for the same reason `avian3d` is
# one: this crate's whole point is that a CPU-only consumer never compiles the
# renderer, and `isomesh-gpu` carries `wgpu`. Dev-dependencies are not
# propagated, so nobody depending on `bevy_isomesh` inherits it.
#
# The wgpu pin is what makes this safe. `isomesh-gpu` asks for 29.0.3 and Bevy
# 0.19 asks for 29.0.3, so Cargo unifies them onto one copy -- verified below
# rather than assumed, because the failure mode is two silently coexisting
# majors and a type error about `TextureFormat` not matching itself.
isomesh-gpu = { path = "../crates/isomesh-gpu" }

# E-203 only. The acid test is "walk every chunk seam and never fall through",
# and answering that needs a ray cast against the meshed triangles -- not a
# physics engine. parry3d is the same version the core crate's own collider
# tests use, so the example is checking the geometry a consumer would actually
# hand to a physics engine rather than a stand-in for it.
parry3d = "0.30"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Meshing in a debug build is 20-50x slower and will make you think something is
# wrong with the algorithm rather than with the profile. Examples are always run
# with --release, and this keeps a debug run merely slow rather than unusable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
