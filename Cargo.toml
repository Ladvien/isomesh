[workspace]
# Resolver 3 is mandatory, not optional: a *virtual* manifest has no `edition` to
# infer the resolver from, so omitting this silently falls back to resolver 1.
resolver = "3"
members = ["crates/*"]
# `bevy_isomesh` is its own workspace. In a shared one, Cargo's feature
# unification leaks Bevy's features into this lockfile and `cargo test` stops
# testing what consumers actually get. See CLAUDE.md.
#
# `isomesh_web` is excluded for the same reason and one more: it exists to
# measure what `isomesh` alone costs on the wire, which a shared lockfile would
# make depend on whatever every other member happens to enable. It is listed
# rather than merely unmatched by `members`, so that a reader of this file knows
# it is there -- and so `cargo clippy --workspace` never silently skips it, which
# is E-111's lesson and why `preflight.sh` runs its gates separately.
exclude = ["bevy_isomesh", "isomesh_web"]

[workspace.package]
version = "0.0.9"
edition = "2024"
# The floor is set by the dependency graph the msrv CI job actually checks
# (`--workspace --all-targets`, so dev-dependencies count): wgpu/naga 29.x
# declare 1.87, and `wide`/`safe_arch` (via parry3d, dev-only) declare 1.89.
# The old claim of 1.85 was never true once isomesh-gpu existed -- cargo
# itself rejected it on every CI run. Verified: `cargo +1.89 check
# --workspace --all-targets` is clean.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ladvien/isomesh"
authors = ["C. Thomas Brittain <cthomasbrittain@yahoo.com>"]
categories = ["graphics", "game-development", "no-std", "rendering", "mathematics"]
keywords = ["isosurface", "voxel", "marching-cubes", "dual-contouring", "sdf"]

[workspace.dependencies]
libm = { version = "0.2", default-features = false }

[workspace.lints.rust]
# Mechanically enforces BACKLOG's "Public items have doc comments" under -D warnings.
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

# R-062. `cfg(kani)` is set by Kani's own compiler and by nothing else, so
# `--cfg kani` code is invisible to `cargo build`, `cargo test` and docs.rs --
# which is what keeps hard rule 3 untouched. Declaring it here is how the
# `unexpected_cfgs` lint learns the name; without this the whole workspace fails
# `-D warnings` the moment a proof module exists.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Mechanically enforces the no-stubs rule: a placeholder cannot be committed.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
float_cmp = "warn"
# `clippy::pedantic` is deliberately absent. On a numerics crate it fights the
# domain -- `cast_precision_loss` fires on every f64->f32 narrowing and
# `many_single_char_names` fires on QEF code that is literally n1,n2,n3,d1,d2,d3
# from the adjacent-math audit. The result is a wall of #[allow]s.

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
# criterion and samply want frame pointers.
debug = true
