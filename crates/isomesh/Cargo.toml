[package]
name = "isomesh"
description = "Engine-agnostic isosurface extraction: signed distance field in, triangles out. no_std, f32 and f64, no math library in the public API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
documentation = "https://docs.rs/isomesh"
# crates.io renders this as the crate's landing page, and without it the page is
# blank. It is deliberately *not* a copy of the repository README: relative image
# paths do not resolve on crates.io, so every link here is absolute, and a reader
# arriving from a search wants "what is this and how do I call it" rather than
# seventeen demos. The repository README is the one with the pictures.
readme = "README.md"

[lints]
workspace = true

# docs.rs builds with every feature, so the `experimental` module appears there
# even though it is off by default. A reader evaluating the crate should be able
# to see what is behind a feature without checking out the source to find out it
# exists -- D-0/B-010, per Effective Rust Item 27: crates.io is for people
# CHOOSING a crate, docs.rs for people USING one.
[package.metadata.docs.rs]
all-features = true

[features]
# Speculative algorithms, off by default and exempt from semver -- X-003.
#
# It adds no dependencies and is not meant to: `cargo tree -p isomesh -e normal`
# is `isomesh + libm` with it on or off, which
# `the_experimental_feature_adds_no_dependencies` checks. A feature that quietly
# pulled in a dependency would break the crate's whole pitch for the consumers
# who never enable it.
experimental = []

[dependencies]
# The crate's only dependency. `core` has no sqrt/floor/sin/cos on stable, and
# `libm` is used unconditionally rather than behind a `std` switch so there is
# exactly one float backend and one set of results. Justification in CLAUDE.md.
libm = { workspace = true }

[dev-dependencies]
# Dev-dependencies are not propagated to consumers, so this does not touch
# rule 3's budget -- `cargo tree -p isomesh -e normal` is still two packages.
# Pinned at the version whose MSRV matches ours exactly.
proptest = "1.11"

# T-006. Held at 0.7 when this workspace promised 1.85 and criterion 0.8's
# floor was 1.86; the workspace now promises 1.89, so that reason has expired
# and the hold stands only until someone bumps it deliberately. The `msrv` CI
# job runs `cargo check --workspace --all-targets`, which includes benches, so
# any bump is checked rather than trusted. 0.7 declares 1.80.
#
# `default-features = false` drops `rayon` and `plotters`. Neither earns its
# tree here: the benchmarks are single-threaded by construction because that is
# what a per-chunk meshing budget looks like, and the numbers this ticket exists
# to produce go to CSV under docs/measurements/, not to generated HTML.
# `cargo_bench_support` is what makes `cargo bench` work at all.
criterion = { version = "0.7", default-features = false, features = [
    "cargo_bench_support",
] }
# G-005. A **dev**-dependency rather than the optional `parry` feature the ticket
# asked for, and that is a deviation with a reason.
#
# `parry3d` takes `Vec<[u32; 3]>` for its index buffer -- the architecture
# research calls it "the most math-opinionated crate in the ecosystem" and notes
# it still uses plain arrays there -- so a conversion adds one line at the call
# site and nothing else. What it would add to the *manifest* is a pre-1.0 version
# to track: parry migrated off nalgebra onto glam/glamx in 0.26.0 and now wants
# glam ^0.33, where the engine version this workspace pins against wants ^0.32 --
# the skew documented in CLAUDE.md's hard version pins. The core crate stays at
# one dependency in every configuration instead.
#
# Here it earns its place by making G-005's acceptance real: the test builds an
# actual `TriMesh` from a carved field and runs parry's own
# `TriMeshFlags::HALF_EDGE_TOPOLOGY` and `ORIENTED` checks over it, rather than
# this crate asserting against its own idea of what parry wants.
parry3d = "0.30"

# Both are `harness = false` because criterion supplies its own main, and the
# resolution sweep supplies one of its own -- see benches/resolution_sweep.rs.
#
# `test = false` is necessary and NOT sufficient, which was worth finding out
# the hard way. CI runs `cargo test --workspace --all-targets`, and an explicit
# `--all-targets` re-selects bench targets regardless of this flag -- measured:
# the sweep ran anyway, in a debug build, for minutes, and overwrote the
# committed CSV with numbers 62x slower than the release ones.
#
# The flag stays because it is right for ordinary `cargo test`. What actually
# stops it is the `--bench` guard at the top of `resolution_sweep`'s `main`:
# cargo passes `--bench` under `cargo bench` and passes nothing under
# `cargo test`, which is the same discriminator criterion uses internally.
# Benches are still compiled by the `check`/`clippy --all-targets` jobs, so they
# cannot rot.
[[bench]]
name = "ablation"
harness = false
test = false

[[bench]]
name = "extract"
harness = false
test = false

[[bench]]
name = "resolution_sweep"
harness = false
test = false

[[bench]]
name = "shootout"
harness = false
test = false

[[bench]]
name = "stage_breakdown"
harness = false
test = false
