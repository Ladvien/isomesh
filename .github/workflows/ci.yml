name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Declared here rather than per job, because the default for a workflow with no
# block at all is the repository's default token scope -- and `deploy-pages`
# needs `pages: write` plus the OIDC `id-token: write` it exchanges for the
# deployment. `contents: read` is everything the other jobs want.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    name: fmt, clippy, docs, dependency gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `missing_docs` is a workspace lint, so clippy already covers the
      # "public items have doc comments" rule. This covers the other half:
      # links that point at nothing, which clippy does not see.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      # The three claims the crate is built on. Each fails loudly and prints
      # what it actually found, because a silent pass here is how a dependency
      # policy stops meaning anything.
      - name: dependency gates
        run: |
          set -euo pipefail

          # `-e normal` is load-bearing: cargo's default edges are
          # normal,build,dev, so the bare command would count proptest's and
          # criterion's whole trees once those land as dev-dependencies.
          echo '--- isomesh must resolve to exactly two packages ---'
          cargo tree -p isomesh -e normal
          count=$(cargo tree -p isomesh -e normal --prefix none | sort -u | grep -c .)
          if [ "$count" -ne 2 ]; then
            echo "::error::isomesh resolved to $count packages, expected 2 (isomesh, libm)"
            exit 1
          fi

          # Rule 2 is about what the crates *depend on and compile*, and prose
          # is not that. The original form -- `grep -ril bevy crates/` -- went
          # red at GPU-001 and stayed red for the whole GPU series, because the
          # GPU crate's manifest and docs must be able to say *why* wgpu is
          # pinned to Bevy's exact version. Manifests are checked with comments
          # stripped; source is checked for code rather than comments. The
          # resolved-graph check below remains the strong form.
          echo '--- rule 2: no bevy dependency or code reference under crates/ ---'
          if sed 's/#.*//' crates/*/Cargo.toml | grep -n bevy; then
            echo "::error::rule 2 violated: a crates/ manifest names bevy outside a comment"
            exit 1
          fi
          if grep -rn --include='*.rs' bevy crates/ | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)'; then
            echo "::error::rule 2 violated: non-comment bevy reference in crates/ source (listed above)"
            exit 1
          fi

          echo '--- and none in the resolved graph ---'
          bevy=$(cargo metadata --format-version 1 | grep -c '"name":"bevy' || true)
          if [ "$bevy" -ne 0 ]; then
            echo "::error::$bevy bevy packages in the root workspace graph, expected 0"
            exit 1
          fi

      # BACKLOG.md is the state, so a row that never moved is a lie about what
      # shipped. This runs the same script a developer runs -- the logic lives in
      # one file rather than half here and half in the repo.
      - name: backlog gate
        run: ./scripts/backlog_gate.sh
      # The index is generated, so the only way it stays true is a gate. A stale
      # index answers confidently and wrongly, which is worse than no index.
      - name: findings index is current
        run: ./scripts/findings_index.sh --check
      # The regression checker itself, not the benches -- those take minutes and
      # their timings are meaningless on a shared runner. This proves the gate
      # still detects a regression, which is the half that can rot silently.
      - name: regression checker detects a regression
        run: ./scripts/regress.sh --self-test

      # The root README's quickstart is a copy of the crate README's doctested
      # one; the doctest compiles the original and this diff pins the copy.
      - name: readme sync
        run: ./scripts/readme_sync.sh

  test:
    name: test (${{ matrix.os }})
    # Both platforms, deliberately. The crate routes every transcendental
    # through `libm` rather than `std` specifically so that results are
    # bit-identical across operating systems, which is what makes committed
    # golden hashes portable. Running the suite on Linux and macOS is what
    # turns that from a claim into a checked one.
    #
    # The GPU crate's behavioural tests need a real adapter, and headless.rs
    # refuses software rasterisers by design (GPU-009, M-147) -- there is no
    # fallback to fall to. GitHub's ubuntu runners expose no GPU at all, so
    # every isomesh-gpu device test panicked there on every push since GPU-001
    # and this job was red for the whole GPU series. macOS runners expose
    # Metal, so that leg runs the full workspace; the ubuntu leg runs the CPU
    # crate, which is the one the cross-OS golden-hash claim is about. The GPU
    # crate still compiles on ubuntu under the lint job's clippy step, its
    # doctests (all device-free) run on both legs below, and its full suite
    # runs on macOS here and on Linux/Vulkan locally (M-167).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo test --workspace --all-targets
          else
            cargo test -p isomesh --all-targets
          fi
      - name: doc tests
        run: cargo test --workspace --doc
      # X-003: the experimental module is exempt from semver and from nothing
      # else. Its tests only compile with the feature on, so without this step
      # they would sit there looking like coverage and never run.
      - name: experimental feature
        run: cargo test -p isomesh --features experimental --all-targets

  bevy:
    name: bevy_isomesh (separate workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bevy 0.19 enables Wayland by default on Linux, so `wayland-sys`'s build
      # script needs the dev packages even though CI only type-checks and never
      # opens a window. None of these exist on macOS, which is why a local
      # verification could not have caught it.
      - name: system deps for bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # This job is the whole reason the examples live in this crate rather than
      # in a separate one nothing ever builds. `block-mesh`'s examples are pinned
      # to bevy 0.13 and `fast-surface-nets`' to bevy 0.7, both because no CI
      # ever compiled them.
      #
      # `check --all-targets` rather than `build --examples`: it type-checks
      # every example, which is what catches API rot, without paying to codegen
      # and link a full Bevy app on every push. Swap it for `build` the moment
      # something here can fail at link time rather than at type-check time.
      # The lint job's `cargo fmt --all --check` runs from the root, and the root
      # workspace EXCLUDES bevy_isomesh -- so until this line, nothing had ever
      # checked this crate's formatting. Found when a routine `cargo fmt` here
      # reformatted an example that had been committed unformatted.
      - name: rustfmt
        working-directory: bevy_isomesh
        run: cargo fmt --all --check

      - name: check (lib, examples, tests)
        working-directory: bevy_isomesh
        run: cargo check --all-targets
      - name: clippy
        working-directory: bevy_isomesh
        run: cargo clippy --all-targets -- -D warnings
      # The step the root job has and this one did not, so doc links in this
      # workspace had never been checked -- and two were already broken. Same
      # shape as E-111: an excluded workspace is excluded from the root's CI
      # commands too, and the gap is always the step nobody thinks of as
      # linting.
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
        working-directory: bevy_isomesh

      - name: test
        working-directory: bevy_isomesh
        run: cargo test

  msrv:
    name: msrv (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `rust-version` is a claim the manifest makes to consumers. Nothing
      # else checks it, and it is the kind of thing that quietly stops being
      # true -- the original 1.85 did exactly that the day isomesh-gpu landed,
      # since wgpu 29.x declares 1.87.
      - name: read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | tr ',' '\n' | grep '"rust_version"' | head -1 | cut -d'"' -f4)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"
      - name: install it
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - name: check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets

      # `bevy_isomesh` is excluded from the root workspace, so `cargo metadata`
      # above cannot see it and its own `rust-version` was asserted rather than
      # checked -- the same shape of hole M-174 had just closed for the root, and
      # the third the exclusion has produced after rustfmt and rustdoc (I-007).
      #
      # Every check that reads the root workspace needs a deliberate answer for
      # this directory, and "it is excluded" is not one.
      # Bevy 0.19 enables Wayland by default on Linux, so `wayland-sys`'s build
      # script needs the dev packages even to *type-check*. The `bevy` job has
      # carried this step for the same reason; needing it a second time here is
      # I-007's own finding happening to I-007 (M-192).
      - name: system deps for bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: read bevy_isomesh's declared MSRV
        id: bevy_msrv
        working-directory: bevy_isomesh
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | tr ',' '\n' | grep '"rust_version"' | head -1 | cut -d'"' -f4)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"
      - name: install it
        run: rustup toolchain install ${{ steps.bevy_msrv.outputs.version }} --profile minimal
      - name: check bevy_isomesh
        working-directory: bevy_isomesh
        run: cargo +${{ steps.bevy_msrv.outputs.version }} check --all-targets

  # A pull request cannot publish, but it can find out whether it *could*.
  # `cargo publish --dry-run` packages and verification-builds, which is the
  # only thing that sees the errors invisible to every test: a `path` dependency
  # with no `version` (which would have rejected isomesh-gpu's first release),
  # a `license` field with no license file beside it (true of isomesh 0.0.0
  # through 0.0.2, unnoticed for three releases), or a README that lives outside
  # the package directory and is therefore never shipped.
  package:
    name: package (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dry run
        run: ./scripts/publish.sh --dry-run

  # Releasing is a version bump, not a push.
  #
  # `publish.sh` uploads a crate only when its manifest version is absent from
  # crates.io, so pushing a bump releases and pushing anything else exits 0
  # having done nothing. The alternative -- publish on every push -- fails with
  # "crate version already exists" on all but one push in fifty, which leaves
  # main red by default and teaches everyone to stop reading it.
  #
  # `needs` is the load-bearing part. Publishing cannot be undone: a version can
  # be yanked but never deleted, so this must not start until the entire gate
  # has passed *on this commit*. A separate workflow triggered by push could
  # upload while the test job was still red.
  publish:
    name: publish to crates.io
    needs: [lint, test, bevy, msrv, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialised against itself, and never cancelled. The default
    # `cancel-in-progress` above would be free to kill this between the two
    # crates, leaving isomesh published and isomesh-gpu not -- which is
    # recoverable but only by hand.
    concurrency:
      group: publish-crates-io
      cancel-in-progress: false
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # The token check lives in the script, next to the upload it guards, so
        # a push that publishes nothing does not need a secret to stay green.
        # Checking it here made every push to a green main red -- see M-198 and
        # publish.sh's own header.
        run: ./scripts/publish.sh

  # The site is built on every push *and* every pull request, so a change that
  # breaks the wasm build or leaves a dangling markdown link is caught before it
  # reaches main. `build_site.py` fails on any relative link that resolves to
  # nothing, which makes this job the repository's link checker as well.
  site:
    name: pages site (docs + wasm demos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same packages the `bevy` job installs. Nothing in the wasm graph
      # needs them -- winit's x11/wayland deps and `cpal` are target-gated away
      # -- but host build scripts of shared dependencies still run, and this is
      # the cheapest way to not care which.
      - name: system deps for bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: wasm target
        run: rustup target add wasm32-unknown-unknown
      # The version comes out of the lockfile, never a literal here: a
      # wasm-bindgen CLI that disagrees with the crate emits glue for a
      # different ABI and the module fails to instantiate in the browser.
      - name: wasm-bindgen-cli
        run: |
          set -euo pipefail
          WANT=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/,""); print; exit}' \
            bevy_isomesh/Cargo.lock)
          cargo install wasm-bindgen-cli --version "$WANT" --locked
      # `setup-python` rather than the runner's system interpreter: Ubuntu marks
      # that one externally managed (PEP 668) and pip refuses to install into it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: markdown renderer
        run: python3 -m pip install 'markdown>=3.7,<4' 'pymdown-extensions>=10,<11'
      - name: build
        run: ./scripts/build_web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Deploys main only. The Pages source has to be set to "GitHub Actions" once by
  # hand under Settings -> Pages; until that is done this step fails with
  # `Not Found` and no workflow can set it.
  pages:
    name: deploy to github pages
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
